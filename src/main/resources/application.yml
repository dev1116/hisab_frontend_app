spring:
  application:
    name: hisab-backend
  web:
    resources:
      static-locations: file:./uploads/, classpath:/static/

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  datasource:
    url: jdbc:mysql://localhost:3306/hisab_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: hisab_user
    password: hisab1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8082

app:
  jwt:
    secret: hisab-super-secret-key-change-this-in-production-minimum-256-bits
    expiration: 86400000

  upload:
    dir: uploads